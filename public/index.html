<!doctype html>
<html lang="en" data-theme="nox" data-accent="phosphor">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
  <title>AE Secure — encrypted messaging &amp; storage</title>
  <meta name="description" content="AE Secure is a self-hosted, end-to-end encrypted messenger and cloud drive. Keys are derived on your device; the server only ever holds ciphertext." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#04070a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AE Secure" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="referrer" content="no-referrer" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/windows.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style id="boot-style">
    #boot-splash {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column; justify-content: center; gap: 20px;
      padding: 28px clamp(20px, 6vw, 72px);
      background:
        repeating-linear-gradient(180deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px),
        radial-gradient(110% 70% at 50% 112%, rgba(75, 255, 159, .2), transparent 62%),
        linear-gradient(180deg, #020507, #04070a 60%, #05090b);
      color: #e8f2ec; overflow: hidden;
      font-family: "JetBrains Mono", "Cascadia Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    #boot-splash::before {
      content: ""; position: absolute; inset: -10%;
      background-image:
        linear-gradient(to right, rgba(232, 242, 236, .045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(232, 242, 236, .045) 1px, transparent 1px);
      background-size: 54px 54px; mask-image: radial-gradient(120% 80% at 50% 40%, #000 30%, transparent 88%);
      animation: boot-drift 26s linear infinite;
    }
    @keyframes boot-drift { to { transform: translateY(-54px); } }
    #boot-splash .plate {
      position: relative; width: min(520px, 100%); padding: 22px 24px;
      background: rgba(4, 7, 10, .82); border: 1px solid rgba(232, 242, 236, .18);
      clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .8), 14px 14px 0 rgba(0, 0, 0, .55);
    }
    #boot-splash .mark {
      width: 58px; height: 58px; display: grid; place-items: center; margin-bottom: 16px;
      background: #4bff9f; color: #04090a; font-weight: 900; font-size: 24px; letter-spacing: -.02em;
      clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    }
    #boot-splash h1 {
      margin: 0; font-size: clamp(28px, 6vw, 44px); font-weight: 900; line-height: .95;
      letter-spacing: -.035em; text-transform: uppercase;
      font-family: "Archivo Black", "Segoe UI Variable Display", system-ui, sans-serif;
    }
    #boot-splash .hud {
      margin: 12px 0 20px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: rgba(75, 255, 159, .8);
    }
    #boot-splash .hud::before { content: "// "; color: #4bff9f; }
    #boot-splash .log { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #86988e; }
    #boot-splash .log span::before { content: "> "; color: #4bff9f; }
    #boot-splash .bar { margin-top: 18px; height: 6px; background: rgba(0, 0, 0, .55); border: 1px solid rgba(232, 242, 236, .16); }
    #boot-splash .bar i { display: block; height: 100%; width: 34%; background: #4bff9f; box-shadow: 0 0 14px rgba(75, 255, 159, .5); animation: boot-slide 1.15s cubic-bezier(.16,.84,.22,1) infinite; }
    @keyframes boot-slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(320%); } }
    @media (prefers-reduced-motion: reduce) { #boot-splash .bar i { animation: none; width: 60%; } #boot-splash::before { animation: none; } }
  </style>
</head>
<body data-theme="nox" data-accent="phosphor">
  <div id="boot-splash">
    <div class="plate">
      <div class="mark">AE</div>
      <h1>AE Secure</h1>
      <div class="hud">zero-knowledge transport · keys stay on this device</div>
      <div class="log">
        <span>deriving vault key · PBKDF2-SHA256 210 000</span>
        <span>mounting encrypted transport · AES-GCM-256</span>
        <span>binding realtime channel</span>
      </div>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-content:center;background:#04070a;color:#e8f2ec;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center;padding:24px;z-index:20">
      <div style="max-width:44ch;line-height:1.6">
        <h1 style="font-size:22px;margin:0 0 10px;text-transform:uppercase;letter-spacing:-.02em;font-weight:900">Transport offline</h1>
        <p style="color:#86988e;font-size:13px;margin:0">AE Secure performs every encryption step in this browser. Enable JavaScript to sign in — nothing is stored or transmitted as plain text.</p>
      </div>
    </div>
  </noscript>

  <!-- Crypto and platform layer -->
  <script defer src="/js/crypto.js"></script>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/windows.js"></script>
  <script defer src="/js/state.js"></script>
  <script defer src="/js/registry.js"></script>
  <!-- Surfaces -->
  <script defer src="/js/terms.js"></script>
  <script defer src="/js/messages.js"></script>
  <script defer src="/js/communities.js"></script>
  <script defer src="/js/drive.js"></script>
  <script defer src="/js/stories.js"></script>
  <script defer src="/js/airdrop.js"></script>
  <script defer src="/js/clicker.js"></script>
  <script defer src="/js/help.js"></script>
  <script defer src="/js/settings.js"></script>
  <script defer src="/js/admin.js"></script>
  <!-- Shell boots last -->
  <script defer src="/js/app.js"></script>
</body>
</html>
