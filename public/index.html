<!doctype html>
<html lang="en" data-theme="nox" data-accent="ink">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
  <title>AE Secure — encrypted messaging &amp; storage</title>
  <meta name="description" content="AE Secure is a self-hosted, end-to-end encrypted messenger and cloud drive. Keys are derived on your device; the server only ever holds ciphertext." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0a0b0b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#e8e7e1" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AE Secure" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="referrer" content="no-referrer" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/windows.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style id="boot-style">
    #boot-splash {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column; justify-content: center;
      padding: 28px clamp(20px, 6vw, 72px);
      background: #0a0b0b; color: #f1f1ee;
      font-family: "JetBrains Mono", "Cascadia Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow: hidden;
    }
    #boot-splash::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(to right, rgba(241, 241, 238, .05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(241, 241, 238, .05) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }
    #boot-splash .plate {
      position: relative; width: min(520px, 100%); padding: 24px 26px;
      background: #0a0b0b; border: 1px solid rgba(241, 241, 238, .3);
      box-shadow: 12px 12px 0 rgba(0, 0, 0, .5);
      clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px);
    }
    #boot-splash .mark {
      width: 56px; height: 56px; display: grid; place-items: center; margin-bottom: 18px;
      background: #f1f1ee; color: #0a0b0b;
      font-family: "Archivo Black", "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
      font-weight: 900; font-size: 23px; letter-spacing: -.02em;
    }
    #boot-splash h1 {
      margin: 0; font-size: clamp(30px, 6vw, 46px); font-weight: 900; line-height: .94;
      letter-spacing: -.035em; text-transform: uppercase;
      font-family: "Archivo Black", "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
    }
    #boot-splash .rule { height: 2px; background: #f1f1ee; margin: 16px 0 14px; }
    #boot-splash .hud {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(241, 241, 238, .62);
    }
    #boot-splash .log { display: flex; flex-direction: column; gap: 5px; margin-top: 18px; font-size: 12px; color: #9a9b97; }
    #boot-splash .log span { border-left: 2px solid rgba(241, 241, 238, .28); padding-left: 9px; }
    #boot-splash .bar { margin-top: 20px; height: 8px; background: #141515; border: 1px solid rgba(241, 241, 238, .22); }
    #boot-splash .bar i { display: block; height: 100%; width: 30%; background: #f1f1ee; animation: boot-slide 1.2s cubic-bezier(.16,.84,.22,1) infinite; }
    @keyframes boot-slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(345%); } }
    @media (prefers-reduced-motion: reduce) { #boot-splash .bar i { animation: none; width: 58%; } }
  </style>
</head>
<body data-theme="nox" data-accent="ink">
  <div id="boot-splash">
    <div class="plate">
      <div class="mark">AE</div>
      <h1>AE Secure</h1>
      <div class="rule"></div>
      <div class="hud">zero-knowledge transport &middot; keys stay on this device</div>
      <div class="log">
        <span>deriving vault key &middot; PBKDF2-SHA256 210 000</span>
        <span>mounting transport &middot; AES-GCM-256</span>
        <span>binding realtime channel</span>
      </div>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-content:center;background:#0a0b0b;color:#f1f1ee;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center;padding:24px;z-index:20">
      <div style="max-width:44ch;line-height:1.6">
        <h1 style="font-size:22px;margin:0 0 10px;text-transform:uppercase;letter-spacing:-.02em;font-weight:900">Transport offline</h1>
        <p style="color:#9a9b97;font-size:13px;margin:0">AE Secure performs every encryption step in this browser. Enable JavaScript to sign in — nothing is stored or transmitted as plain text.</p>
      </div>
    </div>
  </noscript>

  <!-- Crypto and platform layer -->
  <script defer src="/js/crypto.js"></script>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/icons.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/windows.js"></script>
  <script defer src="/js/state.js"></script>
  <script defer src="/js/registry.js"></script>
  <!-- Surfaces -->
  <script defer src="/js/terms.js"></script>
  <script defer src="/js/background.js"></script>
  <script defer src="/js/viewer.js"></script>
  <script defer src="/js/messages.js"></script>
  <script defer src="/js/communities.js"></script>
  <script defer src="/js/drive.js"></script>
  <script defer src="/js/avatar.js"></script>
  <script defer src="/js/status.js"></script>
  <script defer src="/js/stories.js"></script>
  <script defer src="/js/airdrop.js"></script>
  <script defer src="/js/clicker.js"></script>
  <script defer src="/js/help.js"></script>
  <script defer src="/js/editor.js"></script>
  <script defer src="/js/settings.js"></script>
  <script defer src="/js/admin.js"></script>
  <script defer src="/js/console.js"></script>
  <!-- Shell boots last -->
  <script defer src="/js/app.js"></script>
</body>
</html>
